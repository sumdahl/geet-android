name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Any Gradle step may build the engine, so every one gets the runner's newest NDK.
      - name: Use the newest NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read the engine version
        id: engine
        run: echo "ref=$(cat engine.version)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: sumdahl/geet
          ref: ${{ steps.engine.outputs.ref }}
          path: geet-engine
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: geet-engine/go.mod
          cache-dependency-path: geet-engine/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            21
            17

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GEET_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/geet.jks"

      - name: Build signed release APKs
        env:
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
          GEET_KEYSTORE: ${{ runner.temp }}/geet.jks
          GEET_KEYSTORE_PASSWORD: ${{ secrets.GEET_KEYSTORE_PASSWORD }}
          GEET_KEY_ALIAS: ${{ secrets.GEET_KEY_ALIAS }}
          GEET_KEY_PASSWORD: ${{ secrets.GEET_KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew assembleRelease -PgeetEngineDir="$GITHUB_WORKSPACE/geet-engine"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "Geet-${GITHUB_REF_NAME}-$abi.apk"
          done
          sha256sum Geet-*.apk > SHA256SUMS

      - name: Release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${previous:+$previous..}${GITHUB_REF_NAME}
          {
            echo "Most phones want **Geet-${GITHUB_REF_NAME}-arm64-v8a.apk**. Older 32-bit phones take armeabi-v7a; x86_64 is for emulators and Chromebooks."
            echo
            git log "$range" --no-merges --pretty='- %s'
          } > notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Geet-*.apk SHA256SUMS --title "Geet ${GITHUB_REF_NAME}" --notes-file notes.md

# Builds on detekt defaults; exceptions below are Compose-driven or aligned with ktlint (.editorconfig).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false
complexity:
  LongParameterList:
    allowedFunctionParameters: 12
    ignoreDefaultParameters: true
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Private helpers aren't API surface; the rule is about what a class exposes.
    ignorePrivate: true
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
  MaxLineLength:
    maxLineLength: 140
  LoopWithTooManyJumpStatements:
    active: false
